<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L2M</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="edition-free">
<div class="ambient" aria-hidden="true">
  <span class="aurora aurora-a"></span>
  <span class="aurora aurora-b"></span>
  <span class="aurora aurora-c"></span>
</div>
<div id="splash">
  <div class="spinner"></div>
  <div id="splash-text" class="muted">&#1580;&#1575;&#1585;&#1613; &#1575;&#1604;&#1578;&#1581;&#1605;&#1610;&#1604;</div>
  <div id="splash-err" class="splash-err" hidden></div>
</div>
<div id="app">

  <header id="titlebar">
    <div class="drag" id="dragbar">
      <div class="brand"><span class="logo">L2M</span></div>
      <div class="titles">
        <div class="h1">LREC&nbsp;&nbsp;&rarr;&nbsp;&nbsp;MP4</div>
        <div class="sub" id="subtitle"></div>
      </div>
    </div>
    <div class="tb-actions">
      <button id="btn-github" class="tb" title="GitHub" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </svg>
      </button>
      <button id="btn-lang" class="tb"></button>
      <button id="btn-support" class="tb support" title="Support the Dev">
        <span class="support-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 8h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8Z"/>
            <path d="M16 9h1.5a2.5 2.5 0 0 1 0 5H16"/>
            <path d="M8 4v1.5M12 3v2M16 4v1.5"/>
          </svg>
        </span>
        <span data-i18n="support"></span>
      </button>
      <button id="btn-min" class="tb" title="Minimize">&#8211;</button>
      <button id="btn-close" class="tb close" title="Close">&#10005;</button>
    </div>
  </header>

  <main id="main">
    <div class="toolbar">
      <span class="h3" data-i18n="recordings"></span>
      <span class="hint" data-i18n="rechor"></span>
      <span class="spacer"></span>
      <button id="btn-clear" class="btn ghost" data-i18n="clear"></button>
      <button id="btn-add" class="btn primary"></button>
    </div>

    <div id="list" class="list"></div>

    <div class="actions">
      <button id="btn-convert" class="btn convert" data-i18n="convert"></button>
      <button id="btn-stop" class="btn danger" data-i18n="stop" disabled></button>
      <button id="btn-open" class="btn ghost" data-i18n="openfolder"></button>
      <button id="btn-output" class="btn ghost" data-i18n="outputfolder"></button>
      <span class="spacer"></span>
      <span id="status" class="status"></span>
    </div>

    <div class="progress"><div id="bar"></div></div>
    <div class="meta"><span id="filetitle"></span><span id="pct"></span></div>

    <div class="loghead">
      <span data-i18n="activity"></span>
      <span class="line"></span>
    </div>
    <pre id="log"></pre>
    <footer class="footer"><span class="copy-mark">&copy;</span> 2026 Qusie</footer>
  </main>
</div>

<div class="overlay" id="m-support" hidden>
  <div class="modal support-modal">
    <div class="support-hero">
      <div class="support-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 8h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8Z"/>
          <path d="M16 9h1.5a2.5 2.5 0 0 1 0 5H16"/>
          <path d="M8 4v1.5M12 3v2M16 4v1.5"/>
        </svg>
      </div>
      <div class="support-copy">
        <h2 data-i18n="support.title"></h2>
        <p class="muted" data-i18n="support.intro"></p>
      </div>
    </div>

    <div class="support-actions">
      <button id="btn-support-site" class="btn primary" data-i18n="support.open"></button>
      <button id="btn-star" class="btn ghost" data-i18n="support.star"></button>
      <button class="btn ghost" data-close data-i18n="support.later"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app_common.js"></script>
<script src="app.js"></script>
</body>
</html>
